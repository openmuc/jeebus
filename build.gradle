
plugins {
    id 'java-library'
    id 'idea'
}

apply plugin: 'idea'
apply plugin: 'java-library'

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

test {
    dependsOn gradle.includedBuild('ship').task(':ship:test')
    dependsOn gradle.includedBuild('spine').task(':spine:test')
    dependsOn gradle.includedBuild('powerlimitation.controllablesystem')
        .task(':abstract-controllablesystem:test')
}
